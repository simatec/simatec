name: Update GitHub stats card

on:
  schedule:
    # täglich um 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stats-Karte generieren
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: simatec
          OUTPUT_PATH: stats.svg
        run: node scripts/generate-stats.js

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Stats."
          else
            git commit -m "chore: update stats card"
            git push
          fi
